name: CI - release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint-build:
    name: Release lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run linters
        run: npm run lint
      - name: Build production application
        run: npm run build

  cross-browser:
    name: Release functional tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run full cross-browser functional suite
        run: npm run test:e2e:cross-browser
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-release-cross-browser-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Release visual regression (Windows Chromium)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Compare approved Windows baselines
        run: npm run test:visual
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-release-visual-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI release gate
    if: always()
    needs:
      - lint-build
      - cross-browser
      - visual
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release check
        shell: bash
        run: |
          test "${{ needs.lint-build.result }}" = "success"
          test "${{ needs.cross-browser.result }}" = "success"
          test "${{ needs.visual.result }}" = "success"
