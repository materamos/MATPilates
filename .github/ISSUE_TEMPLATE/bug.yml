name: Bug
description: Reportar un comportamiento incorrecto o una regresión verificable.
title: "[Bug]: "
labels:
  - bug
assignees:
  - materamos
body:
  - type: textarea
    id: current_behavior
    attributes:
      label: Comportamiento actual
      description: Qué ocurre, dónde ocurre y con qué frecuencia.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproducción y evidencia
      description: Pasos mínimos, URL, viewport, navegador, capturas, logs o cualquier evidencia útil.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Comportamiento esperado
      description: Resultado correcto y fuente que lo confirma.
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Etapa
      options:
        - Etapa 1
        - Etapa 2
        - Sin definir
    validations:
      required: true

  - type: dropdown
    id: delivery
    attributes:
      label: Clasificación de entrega
      description: Usa uno de los cuatro valores canónicos sin traducirlo ni abreviarlo.
      options:
        - Repository-only
        - Preview-only
        - Production-eligible
        - Pending decision
    validations:
      required: true

  - type: textarea
    id: delivery_dependencies
    attributes:
      label: Dependencias de integración y publicación
      description: Indica Issues, ramas, migraciones, configuración, contenido o aprobaciones requeridas.
      placeholder: Escribe "Ninguna" si no aplica.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validación esperada
      placeholder: Indica cómo demostrar que la causa y la corrección quedaron verificadas.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Impacto y riesgos
      placeholder: Describe usuarios afectados, severidad, regresiones posibles o decisiones pendientes.
    validations:
      required: true
